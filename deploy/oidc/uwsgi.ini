[uwsgi]
http-socket = 0.0.0.0:8080
chdir = /label-studio/label_studio
module = core.wsgi:application
master = true
processes = 2
threads = 2
enable-threads = true
die-on-term = true
vacuum = true
disable-logging = true
buffer-size = 32768
# Match upstream body handling: early auth/CSRF denials still need a complete
# HTTP response when the application does not consume the request body.
post-buffering = 4096
harakiri = 120
