name: "CI/CD Pipeline Develop"

on:
  push:
    branches:
      - develop

concurrency:
  group: "CI/CD Pipeline-develop"
  cancel-in-progress: false

jobs:
  gitleaks:
    if: >-
      ${{ github.repository == 'HumanSignal/label-studio' }}
    name: "Linter"
    uses: ./.github/workflows/gitleaks.yml
    with:
      head_sha: ${{ github.sha }}
      base_sha: ${{ github.event.pull_request.base.sha || github.event.before }}

  bandit:
    if: >-
      ${{ github.repository == 'HumanSignal/label-studio' }}
    name: "Linter"
    uses: ./.github/workflows/bandit.yml
    with:
      head_sha: ${{ github.event.pull_request.head.sha || github.event.after }}

  ruff:
    if: >-
      ${{ github.repository == 'HumanSignal/label-studio' }}
    name: "Linter"
    uses: ./.github/workflows/ruff.yml
    with:
      head_sha: ${{ github.event.pull_request.head.sha || github.event.after }}

  blue:
    if: >-
      ${{ github.repository == 'HumanSignal/label-studio' }}
    name: "Linter"
    uses: ./.github/workflows/blue.yml
    with:
      head_sha: ${{ github.event.pull_request.head.sha || github.event.after }}

  biome:
    if: >-
      ${{ github.repository == 'HumanSignal/label-studio' }}
    name: "Linter"
    uses: ./.github/workflows/biome.yml
    with:
      head_sha: ${{ github.event.pull_request.head.sha || github.event.after }}

  stylelint:
    if: >-
      ${{ github.repository == 'HumanSignal/label-studio' }}
    name: "Linter"
    uses: ./.github/workflows/stylelint.yml
    with:
      head_sha: ${{ github.event.pull_request.head.sha || github.event.after }}

  build-docker:
    if: >-
      ${{ github.repository == 'HumanSignal/label-studio' }}
    name: "Build"
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/docker-build.yml
    with:
      sha: ${{ github.event.pull_request.head.sha || github.event.after }}
      branch_name: ${{ github.event.pull_request.head.ref || github.ref_name }}
    secrets: inherit

  deploy:
    if: >-
      ${{ github.repository == 'HumanSignal/label-studio' }}
    name: "Deploy"
    runs-on: ubuntu-latest
    needs:
      - build-docker
    steps:
      - uses: actions/github-script@v8
        env:
          DOCKER_IMAGE_VERSION: ${{ needs.build-docker.outputs.build_version }}
          RELEASE_NAME: 'ls-develop'
        with:
          github-token: ${{ secrets.GIT_PAT }}
          script: |
            const docker_image_version = process.env.DOCKER_IMAGE_VERSION;
            const release_name = process.env.RELEASE_NAME;
            github.rest.actions.createWorkflowDispatch({
              owner: "HumanSignal",
              repo: "label-studio-enterprise",
              workflow_id: "argocd-deploy.yml",
              ref: "develop",
              inputs: {
                docker_image_version: docker_image_version,
                release_name: release_name,
                template_name: "lso",
              }
            });

  pytest:
    if: >-
      ${{ github.repository == 'HumanSignal/label-studio' }}
    name: "Tests"
    uses: ./.github/workflows/tests.yml
    with:
      head_sha: ${{ github.event.pull_request.head.sha || github.event.after }}
    secrets: inherit

  migrations:
    if: >-
      ${{ github.repository == 'HumanSignal/label-studio' }}
    name: "Tests"
    uses: ./.github/workflows/test_migrations.yml
    with:
      head_sha: ${{ github.event.pull_request.head.sha || github.event.after }}
    secrets: inherit

  conda-test:
    if: >-
      ${{ github.repository == 'HumanSignal/label-studio' }}
    name: "Tests"
    uses: ./.github/workflows/test_conda.yml
    with:
      head_sha: ${{ github.event.pull_request.head.sha || github.event.after }}
    secrets: inherit

  tests-yarn-unit:
    if: >-
      ${{ github.repository == 'HumanSignal/label-studio' }}
    name: "Tests"
    uses: ./.github/workflows/tests-yarn-unit.yml
    with:
      head_sha: ${{ github.event.pull_request.head.sha || github.event.after }}
    secrets: inherit

  tests-yarn-lsf:
    if: >-
      ${{ github.repository == 'HumanSignal/label-studio' }}
    name: "Tests"
    uses: ./.github/workflows/tests-yarn-lsf.yml
    with:
      head_sha: ${{ github.event.pull_request.head.sha || github.event.after }}
    secrets: inherit

  check_gate:
    name: "Ready to ship"
    if: >-
      ${{ github.repository == 'HumanSignal/label-studio' && (always()) }}
    needs:
      - gitleaks
      - bandit
      - ruff
      - blue
      - biome
      - stylelint
      - pytest
      - migrations
      - build-docker
      - tests-yarn-unit
      - tests-yarn-lsf
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: gitleaks, bandit, ruff, blue, biome, stylelint, pytest, migrations, conda-test, build-docker, tests-yarn-unit, tests-yarn-lsf
          jobs: ${{ toJSON(needs) }}
