name: Review upstream Community releases
on:
  schedule: [{cron: '37 8 * * 1'}]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  propose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - name: Propose reviewed update; never deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/oidc/upstream_review.py
